# Legacy configuration. pm_optimize() resolves the julia executable from the system
# PATH (see edisgo/opf/powermodels_opf.py), so julia_bin is not read anywhere. The
# section is kept so config directories carrying it stay loadable.
#
# The bundled eDisGo_OPF.jl package targets Julia 1.12 -- see the installation docs.

[julia_dir]

julia_bin = julia-1.12/bin
