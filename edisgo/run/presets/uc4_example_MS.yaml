_comment: |
  UC3 — OPF with full flexibility:
  Like UC1 but loads real egon_data time series (oedb) and runs a
  powermodels OPF over flexibilities (heat pumps, EV, DSM, storage)
  before the final reinforce. Cost delta = extra reinforcement needed
  under optimal flex dispatch.

_workflow:
  - setup_grid: load ding0 topology, import generators
  - base_reinforce: worst-case TS + reinforce + reset equipment_changes
  - import_generators: from edon-data
  - import_heat_pumps: from egon_data
  - import_home_batteries: from egon_data
  - import_dsm: from egon_data
  - import_electromobility: from egon_data (dumb charging, flex bands)
  - oedb_ts: real wind/solar + load time series (24 h, 2035)
  - apply_heat_pump_strategy: uncontrolled (overwritten by OPF)
  - reactive_power
  - check_integrity
  - optimize: pm_optimize with flex assets (SOC, opf v2)
  - reinforce: final reinforcement
  - save

scenario: eGon2035
grid:
  ding0_path: "/home/gurobi/.ding0/2024-07-25T17:38:34_new_planning_new_edisgo/ding0_grids/32377"
  # grid path should be set in run file
  legacy_ding0_grids: false
  # legacy parameter too

database:
  ssh:
    enabled: false

timeindex: {start: "2035-01-01", periods: 24, freq: h}
# only set in preset, not set in run-functions (eDisGo and eGo)

results:
  directory: results/uc4_example
# actually all parameters


pipeline:
  - setup_grid
  - base_reinforce
  - import_generators
  - import_home_batteries
  - import_heat_pumps
  - import_dsm
  # where is decided, which electromobility use cases are used?
  - import_electromobility: {charging_strategy: dumb, flexibility_bands_ucs : ["home", "work", "public", "hpc"]}
  - apply_heat_pump_strategy: {strategy: uncontrolled}
  - oedb_ts:
      dispatchable: {other: 0.7}
  - reactive_power
  - check_integrity
  - optimize:
      # where is decided which flexibilities are used in the OPF?
      flexible: [heat_pumps, storage, charging_points, dsm]
      method: soc
      opf_version: 2
  - reinforce
  - save
