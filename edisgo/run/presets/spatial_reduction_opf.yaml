_comment: |
  spatial_reduction_opf — OPF on a spatially reduced grid, with a MANUAL time
  window and overlying-grid data read from a CSV directory.

  The standalone / offline sibling of overlying_grid_opf_spatial: that preset
  takes its overlying-grid data from eGo via the `overlying_grid_data` kwarg
  and picks its time steps automatically (`select_critical_timesteps`). This
  one reads CSVs from a directory and uses a fixed window set early via
  `set_timeindex`, so every later import only fetches those steps. That makes
  it the cheap path for a smoke run or for work without a live eGo run; it is
  not the preset to point eGo at for production.

  Spatial complexity reduction (spatial_reduce / spatial_restore) brackets
  `optimize` only:
  - spatial_reduce (before optimize): deepcopies and stashes the full grid on
    ctx, then spatially reduces the working object so `optimize` runs on a
    smaller grid.
  - spatial_restore (after optimize): writes the optimized flexible-component
    dispatch back onto the stashed full grid (by name, or disaggregated onto
    `old_name` members if aggregation_mode is true), recomputes reactive power
    for those components, and makes the full grid active again for `reinforce`.
  Both are no-ops when `spatial_reduction.enabled` is false; this preset sets
  it to true below. `reactive_power` (pre-OPF, full time series) is unaffected
  by the spatial bracket, and reinforcement always runs on the full topology.

_workflow:
  - setup_grid: load ding0 topology
  - import_generators / import_home_batteries
  - set_timeindex: manual — set explicit time index
  - import_heat_pumps / import_dsm: fetch only selected steps
  - import_electromobility: dumb charging, flex bands
  - oedb_ts: real wind/solar + load time series
  - apply_charging_strategy / apply_heat_pump_strategy
  - build_flexibility_bands: EV bands on the fixed hourly index
  - import_overlying_grid_data: HV requirements from the CSV dir
  - reactive_power: fixed cosphi on the selected index
  - spatial_reduce: stash the full grid, reduce the working object
  - optimize: pm_optimize with flex assets, on the reduced grid
  - spatial_restore: write the dispatch back onto the full grid, recompute
      reactive power
  - reinforce / save: always on the full topology

# Self-contained (no `extends`): this preset can be run on its own via
#   run_edisgo({"extends": "spatial_reduction_opf", "grid": {"ding0_path": ...}})
scenario: eGon2035

grid:
  ding0_path: "/path/to/ding0_grid"
  legacy_ding0_grids: false

database:
  source: egon-data      # "egon-data" (local egon-data via ~/.ssh config), "oep", or empty to auto-detect

overlying_grid:
  enabled: true          # false makes import_overlying_grid_data a no-op
  source: csv            # "csv" (load from path) or "etrago" (kwarg)
  path: "/path/to/overlying_grid_csvs"

results:
  directory: results/spatial_reduction_opf

# The manual timestep selection (start/periods/freq) is a step parameter of
# set_timeindex in the pipeline below, not a top-level config block.

# Top-level block read by the spatial_reduce/spatial_restore tasks via
# ctx.raw_config. Note that eGo cannot inject it: _build_run_edisgo_config
# emits only extends, scenario, grid, results, database and overlying_grid, so
# spatial reduction is reachable from eGo only by naming a preset that already
# enables it.
spatial_reduction:
  enabled: true          # false makes spatial_reduce/spatial_restore no-ops
  mode: kmeansdijkstra               # clustering mode for spatial_complexity_reduction
  cluster_area: feeder
  reduction_factor: 0.3
  reduction_factor_not_focused: False
  aggregation_mode: false  # keep false: apply_busmap renames loads but not the
                           # flexibility input frames, so true breaks `optimize`

pipeline:
  - setup_grid
  - import_generators
  - import_home_batteries
  - set_timeindex: {start: "2035-01-15 00:00", periods: 24, freq: h}
  - import_heat_pumps
  - import_dsm
  - import_electromobility:
      charging_strategy: null
      # flexibility bands are built later (build_flexibility_bands), once the
      # analysis time index is fixed, so they are resampled to it
  - oedb_ts:
      dispatchable: {other: 0.7}
  - apply_charging_strategy: {strategy: dumb}
  - apply_heat_pump_strategy: {strategy: uncontrolled}
  - build_flexibility_bands                    # hourly bands on the 2035 index
  - import_overlying_grid_data
  - reactive_power
  - spatial_reduce                             # no-op unless spatial_reduction.enabled
  - optimize:
      flexible: [heat_pumps, storage, charging_points, dsm]
      method: soc
      # opf_version 3 = with high-voltage requirements. This preset runs
      # import_overlying_grid_data, and only versions 3 and 4 turn the
      # overlying-grid series into HV requirement constraints; under version 2
      # they only reach the OPF as generator time series (see
      # run/tasks/io.py), so the flexibility setpoints were ignored.
      # Note that 3, like 1, lifts the grid restrictions (no current/voltage
      # bounds); 2 and 4 keep them via slacks. Reinforcement runs afterwards.
      opf_version: 3
  - spatial_restore                            # no-op unless spatial_reduction.enabled
  - reinforce:
      catch_convergence_problems: true
  - save:
      archive: true
      save_opf_results: true
