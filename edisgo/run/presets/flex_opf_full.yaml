_comment: |
  Full-flex distribution OPF, no overlying-grid constraints.
  Loads real egon_data time series (oedb) and runs a powermodels OPF
  over the full flexibility set (heat pumps, EV, DSM, storage) on the
  distribution grid alone. opf_version 2 — no HV requirements from an
  overlying grid (use the variant with opf_version 3 for that).
  Suitable for runs without eTraGo / without an overlying-grid CSV.

_workflow:
  - setup_grid: load ding0 topology
  - import_generators: from egon_data
  - import_home_batteries: from egon_data
  - import_heat_pumps: from egon_data
  - import_dsm: from egon_data
  - import_electromobility: from egon_data (dumb charging, flex bands)
  - oedb_ts: real wind/solar + load time series (24 h, 2035)
  - apply_charging_strategy: dumb
  - apply_heat_pump_strategy: uncontrolled (overwritten by OPF)
  - optimize: pm_optimize with full flex set (SOC, opf v2)
  - reinforce: final reinforcement under optimized dispatch
  - save

scenario: eGon2035

grid:
  ding0_path: "/path/to/ding0_grid"
  legacy_ding0_grids: false

database:
  ssh:
    enabled: false

timeindex: {start: "2035-01-01", periods: 24, freq: h}

results:
  directory: results/flex_opf_full


pipeline:
  - setup_grid
  - import_generators
  - import_home_batteries
  - import_heat_pumps
  - import_dsm
  - import_electromobility:
      charging_strategy: null
      flexibility_bands_ucs: ["home", "work", "public", "hpc"]
  - oedb_ts:
      dispatchable: {other: 0.7}
      timeindex: {start: "2035-01-01", periods: 24, freq: h}
  - apply_charging_strategy: {strategy: dumb}
  - apply_heat_pump_strategy: {strategy: uncontrolled}
  - reactive_power
  - optimize:
      flexible: [heat_pumps, storage, charging_points, dsm]
      method: soc
      opf_version: 2
  - reinforce
  - save:
      archive: true
      save_opf_results: true
