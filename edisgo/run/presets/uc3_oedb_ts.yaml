_comment: |
  UC3 — real-world time series without OPF:
  Like UC1 but uses real egon_data time series (oedb) instead of
  synthetic worst cases. No optimization, no eTraGo. Difference to
  UC1 is the data source for the final TS; difference to UC2 is no
  OPF.

_workflow:
  - setup_grid: load ding0 topology, import generators
  - base_reinforce: worst-case TS + reinforce + reset equipment_changes
  - import_heat_pumps: from egon_data
  - import_home_batteries: from egon_data
  - import_dsm: from egon_data
  - import_electromobility: from egon_data (dumb charging)
  - oedb_ts: real egon_data time series
  - apply_heat_pump_strategy: uncontrolled
  - reactive_power
  - reinforce: final reinforcement
  - save

scenario: eGon2035

pipeline:
  - setup_grid: {import_generators: true}
  - base_reinforce
  - import_heat_pumps
  - import_home_batteries
  - import_dsm
  - import_electromobility: {charging_strategy: dumb}
  - oedb_ts:
      timeindex: {start: "2035-01-01", periods: 168, freq: h}
      dispatchable: {other: 0.7}
  - apply_heat_pump_strategy: {strategy: uncontrolled}
  - reactive_power
  - reinforce
  - save
