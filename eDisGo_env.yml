name: eDisGo_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python >= 3.11, < 3.14
  - pip
  - pandas >= 3.0, < 3.1.0
  - scipy < 1.18.0
  - conda-forge::fiona
  - conda-forge::geopy
  - conda-forge::geopandas
  - conda-forge::pyproj
  - conda-forge::shapely
  - conda-forge::rasterio
  - conda-forge::geoalchemy2
  - conda-forge::contextily
  - conda-forge::descartes
  - conda-forge::pypsa >= 1.3.0, < 1.4.0
  - pip:
      - eDisGo
