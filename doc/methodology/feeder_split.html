<div class="fsp" id="fsp">
<style>
.fsp { --ink: #1d2731; --muted: #5d6a73; --rule: #d7dee3; --grid: #eef2f4; --acc: #0f6f8c; --acc-soft: #dcedf3;
  --bad: #c2362b; --bad-soft: #f8e1de; --ok: #2b7a4b; --ok-soft: #dff0e5; --c300: #6a4fb3; --c150: #0f6f8c; --c95: #8a6d3b; --c50: #7c8a3b; --one: #e07b00;
  border: 1px solid var(--rule); padding: 14px 16px; margin: 0 0 24px; background: #fff; color: var(--ink);
  font-size: 14px; line-height: 1.45; }
.fsp * { box-sizing: border-box; }
.fsp .fsp-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.fsp .fsp-tab { font: inherit; font-weight: 600; font-size: 13px; line-height: 1.2; padding: 6px 10px; border: 1px solid var(--rule); background: #fff; color: var(--ink);
  border-radius: 4px; cursor: pointer; }
.fsp .fsp-tab[aria-pressed=true] { background: var(--acc); border-color: var(--acc); color: #fff; }
.fsp .fsp-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.fsp .fsp-nav { font: 600 16px/1 monospace; width: 32px; height: 30px; border: 1px solid var(--rule); background: #fff;
  color: var(--ink); border-radius: 4px; cursor: pointer; }
.fsp button:disabled { opacity: .35; cursor: default; }
.fsp button:focus-visible, .fsp input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.fsp input[type=range] { flex: 1 1 200px; min-width: 0; accent-color: var(--acc); }
.fsp .fsp-step { font-weight: 600; min-width: 14em; }
.fsp .fsp-status { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 10px 0 4px; color: var(--muted); }
.fsp .fsp-status b { color: var(--ink); font-variant-numeric: tabular-nums; }
.fsp .fsp-pill { padding: 1px 8px; border-radius: 99px; font-weight: 600; }
.fsp .fsp-pill.bad { background: var(--bad-soft); color: var(--bad); }
.fsp .fsp-pill.ok { background: var(--ok-soft); color: var(--ok); }
.fsp .fsp-pill.idle { background: var(--grid); color: var(--muted); }
.fsp svg { display: block; width: 100%; height: auto; }
.fsp svg text { font-family: inherit; fill: var(--ink); }
.fsp .fsp-sm { font-size: 11px; fill: var(--muted); }
.fsp .fsp-lbl { font-size: 13px; font-weight: 700; }
.fsp .fsp-h { font-size: 12px; font-weight: 700; fill: var(--muted); }
.fsp .fsp-explain { margin: 8px 0 6px; }
.fsp .fsp-scroll { overflow-x: auto; }
.fsp table { border-collapse: collapse; width: 100%; min-width: 460px; font-size: 13px; margin: 4px 0 0; }
.fsp th, .fsp td { border: 0; border-bottom: 1px solid var(--rule); padding: 4px 8px; text-align: left; background: none; }
.fsp th { color: var(--muted); font-weight: 600; font-size: 12px; }
.fsp td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fsp tr.worse td { background: var(--bad-soft); }
.fsp tr.better td { background: var(--ok-soft); }
.fsp .fsp-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12px; margin-top: 2px; }
.fsp .fsp-legend i { display: inline-block; width: 22px; border-top: 3px solid; vertical-align: middle; margin-right: 5px; }
</style>

      svg.appendChild(el("text", { x: (X0 + X1) / 2, y: (top + bot) / 2, "text-anchor": "middle", "class": "fsp-lbl", style: "fill: var(--bad)" }, "no power flow solution after the split"));
    } else if (kind === "split" || kind === "parallel") {
      svg.appendChild(el("text", { x: (X0 + X1) / 2, y: (top + bot) / 2, "text-anchor": "middle", "class": "fsp-sm" }, "power flow of the new topology follows in the next step"));
    }
    if (!early) svg.appendChild(el("text", { x: X0 + 6, y: top + 14, "class": "fsp-sm" }, "dashed: before the split"));
  }

  function drawCurve(sc, kind) {
    var svg = root.querySelector("#fsp-curve"); svg.textContent = "";
    var top = 26, bot = 210, L = 80, R = 770;
    var keys = ["before"];
    if (kind !== "start" && kind !== "point") keys.push("1");
    if (kind === "parallel" || (kind === "pf_ok" && nNew(sc, kind) > 1)) keys.push(String(nNew(sc, kind)));
    var pmax = 0, vmax = 0;
    Object.keys(sc.curves).forEach(function (k) { var c = sc.curves[k]; pmax = Math.max(pmax, c.p_max); c.points.forEach(function (p) { vmax = Math.max(vmax, p[1]); }); });
    pmax = Math.max(pmax, sc.p_behind) * 1.08; vmax = Math.ceil(vmax * 10) / 10;
    function xp(p) { return L + p / pmax * (R - L); }
    function yv(v) { return bot - v / vmax * (bot - top); }
    svg.appendChild(el("text", { x: L - 70, y: 14, "class": "fsp-h" }, "Voltage drop at B6 over the load behind the split node — curves end where the power flow has no solution"));
    for (var v = 0; v <= vmax + 1e-9; v += 0.1) {
      svg.appendChild(el("line", { x1: L, x2: R, y1: yv(v), y2: yv(v), stroke: "var(--grid)" }));
      svg.appendChild(el("text", { x: L - 6, y: yv(v) + 4, "text-anchor": "end", "class": "fsp-sm" }, f(v * 100, 0) + " %"));
    }
    var tick = pmax > 300 ? 100 : pmax > 120 ? 50 : 20;
    for (var p = 0; p <= pmax; p += tick) svg.appendChild(el("text", { x: xp(p), y: bot + 16, "text-anchor": "middle", "class": "fsp-sm" }, p + " kW"));
    svg.appendChild(el("line", { x1: L, x2: R, y1: yv(D.limit), y2: yv(D.limit), stroke: "var(--bad)", "stroke-width": 1.2, "stroke-dasharray": "6 4" }));
    var STY = { before: ["#9aa4ab", "5 4", "before the split"], 1: ["var(--one)", null, "split, 1× " + D.std] };
    keys.forEach(function (k, i) {
      var c = sc.curves[k], s = STY[k] || ["var(--acc)", null, "split, " + k + "× " + D.std];
      svg.appendChild(el("path", { d: c.points.map(function (q, j) { return (j ? "L" : "M") + xp(q[0]) + " " + yv(q[1]); }).join(" "),
        fill: "none", stroke: s[0], "stroke-width": 2.4, "stroke-dasharray": s[1] }));
      var last = c.points[c.points.length - 1], xe = xp(last[0]), ye = yv(last[1]);
      svg.appendChild(el("path", { d: "M" + (xe - 5) + " " + (ye - 5) + " L" + (xe + 5) + " " + (ye + 5) + " M" + (xe - 5) + " " + (ye + 5) + " L" + (xe + 5) + " " + (ye - 5), stroke: s[0], "stroke-width": 2.4 }));
      svg.appendChild(el("text", { x: xe + 8, y: ye + 4, "class": "fsp-sm" }, "max. " + f(c.p_max, 0) + " kW"));
      svg.appendChild(el("line", { x1: L + 10, x2: L + 34, y1: top + 14 + i * 16, y2: top + 14 + i * 16, stroke: s[0], "stroke-width": 2.4, "stroke-dasharray": s[1] }));
      svg.appendChild(el("text", { x: L + 40, y: top + 18 + i * 16, "class": "fsp-sm" }, s[2]));
    });
    svg.appendChild(el("line", { x1: xp(sc.p_behind), x2: xp(sc.p_behind), y1: top, y2: bot, stroke: "var(--ink)", "stroke-width": 1.2 }));
    svg.appendChild(el("text", { x: xp(sc.p_behind) + 5, y: bot - 8, "class": "fsp-sm", style: "fill: var(--ink)" }, "load behind B" + sc.split + ": " + f(sc.p_behind, 0) + " kW"));
  }

  function rTable(sc, n) {
    var rows = [["bypassed path station → B" + sc.split, sc.r_path, null]];
    for (var k = 1; k <= n; k++) rows.push(["split line, " + (k > 1 ? k + " parallel systems" : "one standard line"), sc.r_new / k, sc.r_new / k > sc.r_path]);
    var h = "<table><thead><tr><th>Connection station → B" + sc.split + "</th><th class='num'>Length</th><th class='num'>Resistance</th></tr></thead><tbody>";
    rows.forEach(function (r) {
      h += "<tr" + (r[2] === true ? " class='worse'" : r[2] === false ? " class='better'" : "") + "><td>" + r[0] + "</td><td class='num'>" + f(sc.km_new, 2) + " km</td><td class='num'>" + f(r[1], 3) + " Ω</td></tr>";
    });
    return h + "</tbody></table>";
  }

  function render() {
    var sc = D.scenarios[key], steps = STEPS[key], kind = steps[idx];
    range.max = steps.length - 1; range.value = idx;
    root.querySelector("#fsp-prev").disabled = idx === 0;
    root.querySelector("#fsp-next").disabled = idx === steps.length - 1;
    var LABEL = { start: "Voltage issue", point: "Find the split node", split: "Split the feeder", pf_fail: "Power flow", parallel: "Add a parallel line", pf_ok: "Power flow" };
    root.querySelector("#fsp-step").textContent = "Step " + (idx + 1) + " of " + steps.length + ": " + LABEL[kind];
    var n2 = nNew(sc, kind), st;
    if (kind === "pf_fail") st = "<span class='fsp-pill bad'>no solution</span>";
    else if (kind === "pf_ok") { var e = sc.after[String(n2)]; e = e[e.length - 1]; st = "<span class='fsp-pill " + (e > D.limit ? "bad" : "ok") + "'>" + pc(e) + "</span>"; }
    else if (kind === "start" || kind === "point") st = "<span class='fsp-pill bad'>" + pc(sc.before[sc.before.length - 1]) + "</span>";
    else st = "<span class='fsp-pill idle'>not computed yet</span>";
    root.querySelector("#fsp-status").innerHTML = "<span>voltage drop at B6: " + st + "</span>" +
      "<span>resistance station → B" + sc.split + ": <b>" + f(sc.r_path, 3) + " Ω</b>" + (["start", "point"].indexOf(kind) < 0 ? " → <b>" + f(sc.r_new / n2, 3) + " Ω</b>" : "") + "</span>";
    drawNet(sc, kind); legend(sc); drawProfile(sc, kind); drawCurve(sc, kind);
    var ex = root.querySelector("#fsp-explain"), tb = root.querySelector("#fsp-table"), worse = sc.r_new > sc.r_path, tx;
    tb.innerHTML = "";
    if (kind === "start") {
      tx = "The power flow shows a voltage drop above the allowed " + pc(D.limit) + " at B" + sc.critical.join(", B") + ". Per feeder, only the critical bus <b>farthest from the station</b> is treated: B" + sc.far + ", at " + f(nodeKm[sc.far], 2) + " km.";
    } else if (kind === "point") {
      tx = "The split node is the first bus at or beyond two thirds of the path length to B" + sc.far + ": B" + sc.split + " at " + f(nodeKm[sc.split], 2) + " km. In LV grids it is moved back towards the station if it lies inside a building, in MV grids it is moved forward to the next LV station. " +
        (worse ? "Here the bypassed path is built from thick and parallel cables: its resistance is lower than that of the new standard line." : "The bypassed path has a higher resistance than the new standard line would have.");
      tb.innerHTML = rTable(sc, 1);
    } else if (kind === "split") {
      tx = "L" + sc.split + ", the line ending at B" + sc.split + ", is disconnected from B" + (sc.split - 1) + " and connected to the station. It becomes one " + D.std + " with the length of the path, " + f(sc.km_new, 2) + " km. B" + sc.split + " to B6 now form a feeder of their own, B1 to B" + (sc.split - 1) + " keep the old lines. " +
        (worse ? "The split line has " + f(sc.r_new / sc.r_path, 1) + " times the resistance of the path it bypasses, and the whole load behind B" + sc.split + " now flows through it." : "The split line has a lower resistance than the bypassed path, and the old path now carries only the load of B1 to B" + (sc.split - 1) + ".");
      tb.innerHTML = rTable(sc, 1);
    } else if (kind === "pf_fail") {
      tx = "The power flow does not converge. Not because of a numerical problem: there is no solution. A line can only transfer a limited power to its end, about U²/(4R) for a purely resistive line. Beyond that, a larger current reduces the voltage more than it increases the power. With one standard line, the feeder behind B" + sc.split + " can be supplied with at most " + f(sc.curves["1"].p_max, 0) + " kW; it has " + f(sc.p_behind, 0) + " kW. Instead of aborting with <code>ValueError: Power flow analysis did not converge</code>, reinforcement continues with the next step.";
    } else if (kind === "parallel") {
      tx = "Every LV grid with split lines from this step is analysed on its own. Only split lines in LV grids that do not converge on their own get a parallel line (here: L" + sc.split + ", round 1 of at most 4). Then the power flow is repeated with the same settings as the reinforcement step.";
      tb.innerHTML = rTable(sc, n2);
    } else {
      var e2 = sc.after[String(n2)], end = e2[e2.length - 1];
      tx = n2 > 1
        ? "With " + n2 + " parallel lines the power flow converges again (up to " + f(sc.curves[String(n2)].p_max, 0) + " kW). But the voltage drop at B6 is " + pc(end) + ", worse than " + pc(sc.before[sc.before.length - 1]) + " before the split: the new connection still has " + f(sc.r_new / n2 / sc.r_path, 1) + " times the resistance of the bypassed path. The next iteration treats the new feeder: its node at two thirds is B" + sc.split + ", which is now directly connected to the station, so the lines on the path are reinforced (see below)."
        : "The power flow converges and the voltage drop at B6 falls from " + pc(sc.before[sc.before.length - 1]) + " to " + pc(end) + (end <= D.limit ? ", within the allowed band. The split solved the voltage issue with one new standard line." : ". Remaining issues are handled in the next iteration.");
    }
    ex.innerHTML = tx;
  }

  var tabs = root.querySelector("#fsp-tabs");
  Object.keys(D.scenarios).forEach(function (k) {
    var b = document.createElement("button"); b.type = "button"; b.className = "fsp-tab"; b.textContent = D.scenarios[k].title;
    b.addEventListener("click", function () { key = k; idx = 0; tabs.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); render(); });
    b.setAttribute("aria-pressed", k === key); tabs.appendChild(b);
  });
  range.addEventListener("input", function () { idx = +range.value; render(); });
  root.querySelector("#fsp-prev").addEventListener("click", function () { if (idx > 0) { idx--; render(); } });
  root.querySelector("#fsp-next").addEventListener("click", function () { if (idx < STEPS[key].length - 1) { idx++; render(); } });
  render();
})();
</script>
</div>
