<div class="vpr" id="vpr">
<style>
.vpr { --ink: #1d2731; --muted: #5d6a73; --rule: #d7dee3; --grid: #eef2f4; --acc: #0f6f8c; --acc-soft: #dcedf3;
  --bad: #c2362b; --bad-soft: #f8e1de; --ok: #2b7a4b; --std: #0f6f8c; --thick: #6a4fb3; --ohl: #8a6d3b;
  border: 1px solid var(--rule); padding: 14px 16px; margin: 0 0 24px; background: #fff; color: var(--ink);
  font-size: 14px; line-height: 1.45; }
.vpr * { box-sizing: border-box; }
.vpr .vpr-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.vpr button { font: 600 16px/1 monospace; width: 32px; height: 30px; border: 1px solid var(--rule); background: #fff;
  color: var(--ink); border-radius: 4px; cursor: pointer; }
.vpr button:disabled { opacity: .35; cursor: default; }
.vpr button:focus-visible, .vpr input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.vpr input[type=range] { flex: 1 1 200px; min-width: 0; accent-color: var(--acc); }
.vpr .vpr-step { font-weight: 600; min-width: 15em; }
.vpr .vpr-status { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 10px 0 4px; color: var(--muted); }
.vpr .vpr-status b { color: var(--ink); font-variant-numeric: tabular-nums; }
.vpr .vpr-pill { padding: 1px 8px; border-radius: 99px; font-weight: 600; }
.vpr .vpr-pill.bad { background: var(--bad-soft); color: var(--bad); }
.vpr .vpr-pill.ok { background: #dff0e5; color: var(--ok); }
.vpr svg { display: block; width: 100%; height: auto; }
.vpr svg text { font-family: inherit; fill: var(--ink); }
.vpr .vpr-sm { font-size: 11px; fill: var(--muted); }
.vpr .vpr-lbl { font-size: 13px; font-weight: 700; }
.vpr .vpr-explain { margin: 8px 0 6px; }
.vpr .vpr-scroll { overflow-x: auto; }
.vpr table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 13px; margin: 0; }
.vpr th, .vpr td { border: 0; border-bottom: 1px solid var(--rule); padding: 4px 8px; text-align: left; background: none; }
.vpr th { color: var(--muted); font-weight: 600; font-size: 12px; }
.vpr td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vpr tr.pick td { background: var(--acc-soft); font-weight: 600; }
.vpr .vpr-bar { height: 10px; background: var(--muted); opacity: .45; display: inline-block; vertical-align: middle; }
.vpr tr.pick .vpr-bar { background: var(--acc); opacity: 1; }
.vpr .vpr-note { color: var(--muted); font-size: 12px; }
.vpr .vpr-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12px; margin-top: 4px; }
.vpr .vpr-legend i { display: inline-block; width: 22px; border-top: 3px solid; vertical-align: middle; margin-right: 5px; }
</style>
