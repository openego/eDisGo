repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.6
  hooks:
    - id: ruff-check
      args: [--fix]
    - id: ruff-format
#- repo: https://github.com/pycqa/pylint
#  rev: pylint-2.6.0
#  hooks:
#    - id: pylint
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: v1.5.5
  hooks:
    - id: insert-license
      files: \.py$
      exclude: ^tests/
      args:
        - --license-filepath
        - .license-header.txt
        - --comment-style
        - "#"
        - --no-extra-eol
- repo: https://github.com/kynan/nbstripout
  rev: 0.8.1
  hooks:
    - id: nbstripout
