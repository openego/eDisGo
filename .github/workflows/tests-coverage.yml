# Tests with pytest the package and monitors the covarage and sends it to coveralls.io
# Coverage is only send to coveralls.io when no pytest tests fail
name: "Tests & Coverage"

on: [push]

# Two-level concurrency control:
# 1. Global lock prevents concurrent tests across different branches (database protection)
# 2. Per-branch cancellation allows new pushes to cancel old runs on same branch
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Global lock to prevent concurrent database access across branches
  database-lock:
    runs-on: ubuntu-latest
    concurrency:
      group: tests-database-access
      cancel-in-progress: false
    steps:
      - name: Acquire database lock
        run: echo "Database lock acquired for ${{ github.ref }}"
  
  build:
    name: "${{ matrix.name-suffix }} at py${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    needs: database-lock

    strategy:
      fail-fast: false
      matrix:
        include:
          - name-suffix: "coverage"
            os: ubuntu-latest
            python-version: 3.9
          - name-suffix: "basic"
            os: ubuntu-latest
            python-version: "3.10"
          - name-suffix: "basic"
            os: ubuntu-latest
            python-version: 3.11
          - name-suffix: "basic"
            os: windows-latest
            python-version: 3.9

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up julia
        if: runner.os == 'Linux'
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.6"

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install --upgrade pip wheel setuptools
          pip install -e "."

      - name: Install packages (Windows)
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          activate-environment: edisgo_env
          environment-file: eDisGo_env_dev.yml
          python-version: ${{ matrix.python-version }}

      - name: Run tests Linux
        if: runner.os == 'Linux' && matrix.name-suffix != 'coverage'
        run: |
          python -m pip install pytest pytest-notebook
          python -m pytest --runslow --runonlinux --disable-warnings --color=yes -v
        env:
          TOEP_TOKEN_KH: ${{ secrets.TOEP_TOKEN_KH }}

      - name: Run tests Windows
        if: runner.os == 'Windows'
        run: |
          python -m pip install pytest pytest-notebook
          python -m pytest --runslow --disable-warnings --color=yes -v
        env:
          TOEP_TOKEN_KH: ${{ secrets.TOEP_TOKEN_KH }}

      - name: Run tests, coverage and send to coveralls
        if: runner.os == 'Linux' && matrix.python-version == 3.9 && matrix.name-suffix == 'coverage'
        run: |
          pip install pytest pytest-notebook coveralls
          coverage run --source=edisgo -m pytest --runslow --runonlinux --disable-warnings --color=yes -v
          coveralls
        env:
          TOEP_TOKEN_KH: ${{ secrets.TOEP_TOKEN_KH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_SERVICE_NAME: github
