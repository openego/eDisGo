# Runs regular tests with offline coverage and live OEP tests in a separate job.
# Coverage is submitted only when the selected non-OEP tests succeed.
name: "Tests & Coverage"

# Cancel an outdated workflow when a newer commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on: [push]

jobs:
  build:
    name: "${{ matrix.name-suffix }} at py${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name-suffix: "coverage"
            os: ubuntu-latest
            python-version: 3.12
            timeout: 140

          - name-suffix: "basic"
            os: ubuntu-latest
            python-version: 3.11
            timeout: 360

          - name-suffix: "basic"
            os: ubuntu-latest
            python-version: "3.10"
            timeout: 360

          - name-suffix: "basic"
            os: windows-latest
            python-version: "3.10"
            timeout: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Julia is only needed on Linux. The version must match the one the checked-in
      # eDisGo_OPF.jl/Manifest.toml was resolved with: Main.jl runs Pkg.instantiate()
      # on that manifest, and it pins stdlibs that only exist from Julia 1.12 on.
      - name: Set up Julia
        if: runner.os == 'Linux'
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e "."

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: "latest"
          activate-environment: edisgo_env
          environment-file: eDisGo_env_dev.yml
          python-version: ${{ matrix.python-version }}

      - name: Run regular tests (Linux)
        if: runner.os == 'Linux' && matrix.name-suffix == 'basic'
        run: |
          python -m pip install "pytest<9.2.0" "nbclient<0.12.0"
          python -m pytest --runslow --runonlinux -m "not oep" \
            --disable-warnings --color=yes -v

      - name: Run regular tests (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install "pytest<9.2.0" "nbclient<0.12.0"
          # This step uses PowerShell, where "\" is not a line continuation.
          python -m pytest --runslow -m "not oep" --disable-warnings --color=yes -v

      - name: Run regular tests with coverage and submit to Coveralls
        if: matrix.name-suffix == 'coverage'
        run: |
          python -m pip install \
            "pytest<9.2.0" \
            "nbclient<0.12.0" \
            coveralls
          coverage run --source=edisgo -m pytest \
            --runslow \
            --runonlinux \
            -m "not oep" \
            --disable-warnings \
            --color=yes \
            -v
          coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_SERVICE_NAME: github

  oep:
    if: github.actor != 'dependabot[bot]'
    name: "Live OEP tests at py3.12 on Linux"
    runs-on: ubuntu-latest
    timeout-minutes: 140
    # Serialize live OEP access across branches in this repository. Superseded
    # commits on the same branch are still canceled by workflow concurrency.
    concurrency:
      group: edisgo-live-oep
      cancel-in-progress: false
      queue: max

    steps:
      - name: Require OEP token
        shell: bash
        env:
          OEP_TOKEN: ${{ secrets.OEP_TOKEN }}
        run: |
          if [[ -z "${OEP_TOKEN//[[:space:]]/}" ]]; then
            echo "::error::OEP_TOKEN is missing or empty. Configure the OEP_TOKEN repository secret to run live OEP tests."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e "."
          python -m pip install "pytest<9.2.0" "nbclient<0.12.0"

      # No parallel pytest workers or automatic retries: the live contracts
      # and OEP-dependent notebooks run one at a time.
      - name: Run live OEP tests
        run: |
          python -m pytest --runoep --runslow --runonlinux -m "oep" \
            --disable-warnings --color=yes -v
        env:
          OEP_TOKEN: ${{ secrets.OEP_TOKEN }}
