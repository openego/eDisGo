# Basic jobs run regular tests; the coverage entry also runs live OEP tests.
# Full coverage is submitted only when all selected tests succeed.
name: "Tests & Coverage"

# Cancel an outdated workflow when a newer commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on: [push]

jobs:
  build:
    name: "${{ matrix.name-suffix }} at py${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    # Only coverage accesses the OEP. Serialize those entries across branches;
    # basic jobs and OEP-free Dependabot runs use distinct groups.
    concurrency:
      group: >-
        ${{ matrix.name-suffix == 'coverage' && github.actor != 'dependabot[bot]'
            && 'edisgo-live-oep'
            || format('edisgo-tests-{0}-{1}-{2}', github.run_id, matrix.os, matrix.python-version) }}
      cancel-in-progress: false
      queue: max

    strategy:
      fail-fast: false
      matrix:
        include:
          - name-suffix: "coverage"
            os: ubuntu-latest
            python-version: 3.12
            timeout: 140

          - name-suffix: "basic"
            os: ubuntu-latest
            python-version: 3.11
            timeout: 360

          - name-suffix: "basic"
            os: ubuntu-latest
            python-version: "3.10"
            timeout: 360

          - name-suffix: "basic"
            os: windows-latest
            python-version: "3.10"
            timeout: 360

    steps:
      - name: Require OEP token for full coverage
        if: matrix.name-suffix == 'coverage' && github.actor != 'dependabot[bot]'
        shell: bash
        env:
          OEP_TOKEN: ${{ secrets.OEP_TOKEN }}
        run: |
          if [[ -z "${OEP_TOKEN//[[:space:]]/}" ]]; then
            echo "::error::OEP_TOKEN is missing or empty. Configure the OEP_TOKEN repository secret to run live OEP tests."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Julia is only needed on Linux. The version must match the one the checked-in
      # eDisGo_OPF.jl/Manifest.toml was resolved with: Main.jl runs Pkg.instantiate()
      # on that manifest, and it pins stdlibs that only exist from Julia 1.12 on.
      - name: Set up Julia
        if: runner.os == 'Linux'
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e "."

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: "latest"
          activate-environment: edisgo_env
          environment-file: eDisGo_env_dev.yml
          python-version: ${{ matrix.python-version }}

      - name: Run regular tests (Linux)
        if: runner.os == 'Linux' && matrix.name-suffix == 'basic'
        run: |
          python -m pip install "pytest<9.2.0" "nbclient<0.12.0"
          python -m pytest --runslow --runonlinux -m "not oep" \
            --disable-warnings --color=yes -v

      - name: Run regular tests (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install "pytest<9.2.0" "nbclient<0.12.0"
          # This step uses PowerShell, where "\" is not a line continuation.
          python -m pytest --runslow -m "not oep" --disable-warnings --color=yes -v

      - name: Run all tests with coverage and submit to Coveralls
        if: matrix.name-suffix == 'coverage' && github.actor != 'dependabot[bot]'
        run: |
          python -m pip install \
            "pytest<9.2.0" \
            "nbclient<0.12.0" \
            coveralls
          python -m coverage run --source=edisgo -m pytest \
            --runoep \
            --runslow \
            --runonlinux \
            --disable-warnings \
            --color=yes \
            -v
          coveralls
        env:
          OEP_TOKEN: ${{ secrets.OEP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_SERVICE_NAME: github

      # Dependabot has no Actions OEP secret. Still run the regular selection,
      # but do not upload a partial result as full-suite coverage.
      - name: Run regular tests (Dependabot coverage entry)
        if: matrix.name-suffix == 'coverage' && github.actor == 'dependabot[bot]'
        run: |
          python -m pip install "pytest<9.2.0" "nbclient<0.12.0"
          python -m pytest --runslow --runonlinux -m "not oep" \
            --disable-warnings --color=yes -v
