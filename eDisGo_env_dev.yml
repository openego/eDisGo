name: eDisGo_env_dev
channels:
  - conda-forge
  - defaults
dependencies:
  - python >= 3.9, < 3.11
  - pip
  - pandas >= 1.4, < 2.2.0
  - conda-forge::fiona
  - conda-forge::geopy
  - conda-forge::geopandas
  - conda-forge::pyproj
  - conda-forge::shapely
  - conda-forge::rasterio
  - conda-forge::geoalchemy2
  - conda-forge::pygeos
  - conda-forge::contextily
  - conda-forge::descartes
  - conda-forge::pypsa == 0.26.2
  - pip:
      - -e .[dev]
